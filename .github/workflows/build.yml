
name: Build GeForce NOW UI Preview

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git glslang-tools

      - name: Fetch XSDK
        run: |
          git clone --depth 1 \
            https://github.com/xenosworks/xsdk.git xsdk

      - name: Cache XSDK toolchain
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-toolchain-v1

      - name: Build PowerPC toolchain
        run: |
          PREFIX=$HOME/xsdk-gcc \
          WORK=$HOME/xsdk-gcc-work \
          JOBS=2 \
          bash xsdk/tools/toolchain/build.sh

      - name: Configure GLSL compiler
        run: |
          test -x "$HOME/xsdk-gcc/bin/glslang" || \
            ln -s "$(command -v glslangValidator)" "$HOME/xsdk-gcc/bin/glslang"

      - name: Build XSDK libraries
        run: |
          make -C xsdk -j2 \
            TOOLCHAIN=$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-

      - name: Configure GeForce NOW UI
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/xsdk/cmake/xsdk.cmake \
            -DXSDK_TOOLCHAIN=$HOME/xsdk-gcc \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build GeForce NOW UI XEX
        run: |
          cmake --build build --parallel 2

      - name: Upload GeForce NOW UI XEX
        uses: actions/upload-artifact@v4
        with:
          name: geforce-now-xbox360-ui
          path: build/geforce_now_ui.xex
          if-no-files-found: error
          
